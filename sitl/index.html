<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ArduSub SITL</title>
  </head>
  <body>
    <p id="status">Starting ArduSub...</p>
    <p>Keep this tab open while using <a href="../?MAVLink2RestWebsocketURI=sitl://ardusub" target="_blank">Cockpit</a>.</p>
    <script type="module">
      const status = document.getElementById('status')

      if (!crossOriginIsolated) {
        if (navigator.serviceWorker.controller) {
          status.textContent = 'This browser can not isolate the page, ArduSub can not run.'
          throw new Error('page is controlled by the service worker but not cross-origin isolated')
        }
        await navigator.serviceWorker.register('service-worker.js')
        await navigator.serviceWorker.ready
        location.reload()
      } else {
        const { default: createModule } = await import('./ardusub.js')
        const module = await createModule({
          arguments: ['--model', 'vectored', '--serial0', 'wasm', '--serial1', 'none', '--serial2', 'none'],
          print: console.log,
          printErr: console.error,
        })

        const read = module.cwrap('ardupilot_serial_read', 'number', ['number', 'number', 'number'])
        const write = module.cwrap('ardupilot_serial_write', 'number', ['number', 'number', 'number'])
        const malloc = module.cwrap('ardupilot_malloc', 'number', ['number'])
        const bufferSize = 4096
        const readBuffer = malloc(bufferSize)
        const writeBuffer = malloc(bufferSize)

        // Cockpit connects with sitl://ardusub, the URI host is the channel name
        const channel = new BroadcastChannel('ardusub')
        channel.onmessage = ({ data }) => {
          module.HEAPU8.set(data.subarray(0, bufferSize), writeBuffer)
          write(0, writeBuffer, Math.min(data.length, bufferSize))
        }

        setInterval(() => {
          const length = read(0, readBuffer, bufferSize)
          if (length > 0) {
            // slice copies out of the SharedArrayBuffer, which can not be sent to a non isolated page
            channel.postMessage(module.HEAPU8.slice(readBuffer, readBuffer + length))
          }
        }, 10)

        status.textContent = 'ArduSub is running.'
      }
    </script>
  </body>
</html>
